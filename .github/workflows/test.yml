name: LDEV-5725 Component Casting Test

on:
  push:
  workflow_dispatch:
    inputs:
      LUCEE_VERSION_A:
        required: true
        description: Initial Lucee version (start with this)
        type: string
        default: 7.0.0.374-SNAPSHOT
      LUCEE_VERSION_B:
        required: true
        description: Version to deploy (downgrade to this)
        type: string
        default: 7.0.0.373-SNAPSHOT

env:
  TOMCAT_TEMPLATE: https://cdn.lucee.org/express-templates/lucee-tomcat-11.0.14-template.zip
  # DOWNGRADE scenario: start with higher version, deploy lower version
  PUSH_VERSION_A: 7.0.0.374-SNAPSHOT
  PUSH_VERSION_B: 7.0.0.373-SNAPSHOT

jobs:
  test-component-casting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set versions for push workflows
        if: github.event_name == 'push'
        run: |
          echo "VERSION_A=${{ env.PUSH_VERSION_A }}" >> $GITHUB_ENV
          echo "VERSION_B=${{ env.PUSH_VERSION_B }}" >> $GITHUB_ENV

      - name: Set versions for manual workflows
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "VERSION_A=${{ github.event.inputs.LUCEE_VERSION_A }}" >> $GITHUB_ENV
          echo "VERSION_B=${{ github.event.inputs.LUCEE_VERSION_B }}" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download and setup Lucee Express
        run: |
          # Download template
          echo "Downloading Tomcat template..."
          curl --fail -sL "$TOMCAT_TEMPLATE" -o tomcat-template.zip
          unzip -q tomcat-template.zip -d lucee-express

          # Download Lucee version A
          echo "Downloading Lucee $VERSION_A..."
          curl --fail -sL "https://cdn.lucee.org/lucee-$VERSION_A.jar" -o lucee-express/lib/lucee-$VERSION_A.jar

          # Download Lucee version B .lco for later
          echo "Downloading Lucee $VERSION_B .lco..."
          curl --fail -sL "https://cdn.lucee.org/$VERSION_B.lco" -o $VERSION_B.lco

          ls -la lucee-express/lib/
          ls -la *.lco

      - name: Copy test files to webroot
        run: |
          cp tests/*.cfm lucee-express/webapps/ROOT/
          ls -la lucee-express/webapps/ROOT/

      - name: Set up admin password
        run: |
          # Create the lucee-server context directory if it doesn't exist
          mkdir -p lucee-express/lucee-server/context

          # Create password.txt with a known password
          echo "admin" > lucee-express/lucee-server/context/password.txt

          echo "Admin password set to: admin"

      - name: Start Lucee with Version A
        run: |
          cd lucee-express
          chmod +x bin/*.sh

          # Start Tomcat in background
          ./bin/startup.sh

          # Wait for startup
          echo "Waiting for Lucee to start..."
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8888/ 2>/dev/null | grep -q "200\|302\|404"; then
              echo "Lucee is up after $i seconds"
              break
            fi
            sleep 1
          done

          # Give it a bit more time to fully initialize
          sleep 5

      - name: Step 1 - Access admin to load archive bundle
        run: |
          echo "## Step 1: Access ACTUAL ADMIN with Version A ($VERSION_A)" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # First hit the actual admin page to load lucee-admin.lar bundle properly
          # Use -L to follow redirects so the Application.cfc from the archive gets loaded
          echo "### Hitting /lucee/admin/server.cfm to load admin archive bundle..." | tee -a $GITHUB_STEP_SUMMARY
          HTTP_STATUS=$(curl -sL -w "%{http_code}" -o /tmp/admin-response.txt http://127.0.0.1:8888/lucee/admin/server.cfm 2>&1)
          echo "Admin HTTP Status: $HTTP_STATUS" | tee -a $GITHUB_STEP_SUMMARY

          # Also hit web admin - follow redirects
          echo "### Hitting /lucee/admin/web.cfm..." | tee -a $GITHUB_STEP_SUMMARY
          curl -sL -o /tmp/admin-web.txt http://127.0.0.1:8888/lucee/admin/web.cfm 2>&1 || true

          # Hit admin.cfm directly which processes the Application.cfc
          echo "### Hitting /lucee/admin.cfm..." | tee -a $GITHUB_STEP_SUMMARY
          curl -sL -o /tmp/admin-main.txt http://127.0.0.1:8888/lucee/admin.cfm 2>&1 || true

          echo "" >> $GITHUB_STEP_SUMMARY

          # Now check the bundle cache to confirm admin archive is loaded
          echo "### Checking bundle cache after admin access..." | tee -a $GITHUB_STEP_SUMMARY
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o /tmp/step1-response.txt http://127.0.0.1:8888/check-bundle-cache.cfm)
          cat /tmp/step1-response.txt | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HTTP Status: $HTTP_STATUS" | tee -a $GITHUB_STEP_SUMMARY

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Step 1 failed with status $HTTP_STATUS"
            cat /tmp/step1-response.txt
            exit 1
          fi

          # Confirm we see archive bundles loaded
          if grep -q "ARCHIVE:" /tmp/step1-response.txt; then
            echo "✓ Archive bundle loaded successfully" | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "⚠ No archive bundle detected yet - admin may not be fully loaded" | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Step 2 - Copy .lco to patches folder (prep for admin API downgrade)
        run: |
          echo "## Step 2: Prepare for DOWNGRADE via Admin API" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find the lucee-server patches folder
          PATCHES_DIR=$(find lucee-express -type d -name "patches" -path "*/lucee-server/*" 2>/dev/null | head -1)

          if [ -z "$PATCHES_DIR" ]; then
            # Create it if it doesn't exist
            PATCHES_DIR="lucee-express/lucee-server/patches"
            mkdir -p "$PATCHES_DIR"
          fi

          echo "Patches dir: $PATCHES_DIR" | tee -a $GITHUB_STEP_SUMMARY

          # Copy the target version .lco to the patches folder
          cp $VERSION_B.lco "$PATCHES_DIR/"

          echo "Copied $VERSION_B.lco to patches folder" | tee -a $GITHUB_STEP_SUMMARY
          ls -la "$PATCHES_DIR/" | tee -a $GITHUB_STEP_SUMMARY

      - name: Step 3 - DOWNGRADE via Admin API (BUG TRIGGER)
        run: |
          echo "## Step 3: DOWNGRADE via Admin API - THIS IS WHERE THE BUG SHOULD MANIFEST" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Use the admin API to trigger the version change
          # This calls factory.restart() synchronously, which is the bug trigger
          echo "### Calling admin-change-version.cfm to trigger downgrade..." | tee -a $GITHUB_STEP_SUMMARY

          HTTP_STATUS=$(curl -s -w "%{http_code}" -o /tmp/admin-change-response.txt "http://127.0.0.1:8888/admin-change-version.cfm?version=$VERSION_B&password=admin" 2>&1)
          echo "### Response body:" | tee -a $GITHUB_STEP_SUMMARY
          cat /tmp/admin-change-response.txt | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HTTP Status: $HTTP_STATUS" | tee -a $GITHUB_STEP_SUMMARY
          echo "Response size: $(wc -c < /tmp/admin-change-response.txt) bytes" | tee -a $GITHUB_STEP_SUMMARY

          # Check if the admin API call returned an error about casting or classloader issues
          if grep -qi "problem with casting\|ComponentPageImpl\|LDEV-5725 REPRODUCED\|ClassNotFoundException\|NoClassDefFoundError\|bundle wiring.*no longer valid" /tmp/admin-change-response.txt; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ BUG REPRODUCED: Classloader/casting error during version change!" | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Also check if we got HTTP 500 which indicates something broke
          if [ "$HTTP_STATUS" == "500" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ HTTP 500 - Engine may be in broken state" | tee -a $GITHUB_STEP_SUMMARY
          fi

          # Give it a moment to stabilize after restart
          sleep 3

      - name: Step 4 - Test admin access after DOWNGRADE (BUG CHECK)
        run: |
          echo "## Step 4: Test admin access after DOWNGRADE - verify no casting errors" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # First, hit the ACTUAL admin page - this is where the bug should trigger
          # Use -L to follow redirects so the Application.cfc from the archive gets loaded
          echo "### Hitting /lucee/admin/server.cfm after version update..." | tee -a $GITHUB_STEP_SUMMARY
          HTTP_STATUS=$(curl -sL -w "%{http_code}" -o /tmp/admin-after-update.txt http://127.0.0.1:8888/lucee/admin/server.cfm 2>&1)
          echo "Admin HTTP Status: $HTTP_STATUS" | tee -a $GITHUB_STEP_SUMMARY

          # Check if admin returned an error about casting
          if grep -qi "problem with casting\|ComponentPageImpl" /tmp/admin-after-update.txt; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ BUG REPRODUCED in Admin: LDEV-5725 Component Casting Error" | tee -a $GITHUB_STEP_SUMMARY
            grep -i "casting\|ComponentPageImpl" /tmp/admin-after-update.txt | head -20 | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Also run our diagnostic test
          echo "### Running diagnostic instanceof check..." | tee -a $GITHUB_STEP_SUMMARY
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o /tmp/step3-response.txt http://127.0.0.1:8888/trigger-instanceof-check.cfm)
          cat /tmp/step3-response.txt | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HTTP Status: $HTTP_STATUS" | tee -a $GITHUB_STEP_SUMMARY

          # Check for the specific error
          if grep -q "LDEV-5725 CONDITION DETECTED" /tmp/step3-response.txt; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ BUG REPRODUCED: LDEV-5725 Component Casting Error" | tee -a $GITHUB_STEP_SUMMARY
            echo "The instanceof check failed due to classloader mismatch" | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          elif grep -q "problem with casting" /tmp/step3-response.txt; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ BUG REPRODUCED: Component casting error in output" | tee -a $GITHUB_STEP_SUMMARY
            grep -i "casting" /tmp/step3-response.txt | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ No casting error detected" | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Check bundle cache status
        if: always()
        run: |
          echo "## Bundle Cache Status" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          curl -s http://127.0.0.1:8888/check-bundle-cache.cfm | tee -a $GITHUB_STEP_SUMMARY || true

      - name: Tomcat logs
        if: always()
        run: |
          echo "=== catalina.out ==="
          cat lucee-express/logs/catalina.out || true

      - name: Lucee logs
        if: always()
        run: |
          echo ""
          echo "=== exception.log ==="
          find lucee-express -name "exception.log" -exec cat {} \; 2>/dev/null || true

          echo ""
          echo "=== deploy.log ==="
          find lucee-express -name "deploy.log" -exec cat {} \; 2>/dev/null || true

      - name: List Felix cache
        if: always()
        run: |
          echo "=== Felix Cache Bundles ==="
          find lucee-express -type d -name "felix-cache" -exec ls -la {} \; 2>/dev/null || true

          echo ""
          echo "=== Looking for multiple core bundles ==="
          find lucee-express -name "bundle.info" -exec grep -l "lucee.core\|patches\|\.lco" {} \; 2>/dev/null | while read f; do
            echo "--- $f ---"
            cat "$f"
          done
